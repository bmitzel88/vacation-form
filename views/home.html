<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Dream Vacation</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <main>
        <header>
            <img src="/images/banner.jpg" alt="Vacation banner">
            <h1>Book Your Dream Vacation</h1>
        </header>

        <form id="vacation-form" action="#" method="get">
            <div class="container destination">
                <label for="destination">Destination</label>
                <select id="destination">
                    <option id="none" value="none">Choose a destination</option>
                    <option id="cali" value="cali">California</option>
                    <option id="flor" value="flor">Florida</option>
                    <option id="hawi" value="hawi">Hawaii</option>
                </select>
            </div>

            <div class="container">
                <label for="dep-date">Departure Date</label>
                <input type="date" id="dep-date" name="dep-date">
            </div>

            <div class="container">
                <label for="travelers">Number of Travelers</label>
                <input type="number" id="travelers" name="travelers">
            </div>

            <button type="submit" id="submit">Find My Vacation</button>
            
        </form>
    </main>
    <footer>
        <p>GitHub Repository: <a href="https://github.com/bmitzel88/vacation-form">https://github.com/bmitzel88/vacation-form</a></p>
    </footer>
</body>
</html>
